name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      # NOTA: nessuno step di installazione devkitPro qui di proposito.
      # test/compiler_pipeline.test.ts usa test.skipIf(!existsSync("/opt/devkitpro"))
      # e viene quindi saltato onestamente su questo runner (che non ha
      # devkitPro installato), invece di fallire per un ambiente mancante.
      - name: Run test suite
        run: bun test
